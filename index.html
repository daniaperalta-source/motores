<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#2a0008; --navy-2:#6e0014; --navy-soft:#F7EAED;
  --vino-head:linear-gradient(90deg,#120005 0%,#2a0008 38%,#6e0014 72%,#b0001e 100%);
  --vino-card:linear-gradient(110deg,rgba(45,0,9,.95) 0%,rgba(72,0,14,.95) 55%,rgba(110,0,20,.95) 100%);
  --vino-btn:linear-gradient(90deg,#6e0014 0%,#b0001e 100%);
  --rosa:#e8c4cb;
  --red:#C8102E; --red-soft:#FBE9EC;
  --ink:#12161D; --muted:#5A6474; --faint:#8C95A4;
  --line:#E2E5EA; --line-2:#CDD2DA; --bg:#fff; --bg-2:#F3F4F6;
  --ok:#1C7A4C; --ok-soft:#E5F2EB;
  --warn:#9C6210; --warn-soft:#FAF0DE;
  --bad:#C8102E; --bad-soft:#FBE9EC;
  --res:#4A5A78; --res-soft:#ECEFF4;
  --ff-h:'Barlow Condensed','Arial Narrow',sans-serif;
  --ff:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14.5px/1.45 var(--ff);color:var(--ink);background:#fff;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.num,.tn{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex-shrink:0;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.md fieldset{scroll-margin-top:96px}

/* ===== Encabezado ===== */
.top{background:var(--vino-head);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;height:60px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;color:inherit;padding:0;cursor:pointer;text-align:left}
.brand-mark{font:800 19px/1 var(--ff-h);color:#2a0008;background:#fff;padding:6px 8px 5px;border-radius:5px;flex-shrink:0}
.brand-logo{width:40px;height:40px;border-radius:6px;flex-shrink:0;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.brand-t{min-width:0}
.brand-t strong{display:block;font:700 22px/1.05 var(--ff-h);white-space:nowrap}
.brand-t span{display:block;font-size:12px;color:var(--rosa);white-space:nowrap}
.tabs{display:flex;align-self:stretch;margin-left:10px}
.tab{background:none;border:0;color:rgba(255,255,255,.72);font-family:var(--ff-h);font-size:17px;letter-spacing:.01em;padding:0 14px;cursor:pointer;position:relative;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color 150ms ease}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:#fff}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--rosa);white-space:nowrap;background:none;border:0;padding:6px 4px;cursor:default}
.sync i{width:8px;height:8px;border-radius:50%;background:#7C8AA3;flex-shrink:0}
.sync[data-st="ok"] i{background:#45B983}
.sync[data-st="saving"] i,.sync[data-st="loading"] i{background:#E7B04A}
.sync[data-st="error"] i,.sync[data-st="error-load"] i{background:#FF5A6E}
.sync[data-st="error"],.sync[data-st="error-load"]{cursor:pointer;color:#fff;text-decoration:underline;text-underline-offset:3px}
.lockbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid #fff;background:#fff;color:#2a0008;font-weight:600;cursor:pointer;transition:transform 160ms ease-out,background-color 150ms ease,color 150ms ease}
.lockbtn:active{transform:scale(.97)}
body.is-admin .lockbtn{background:#e2f4ed;color:#0d6b4d;border-color:#9fd6c2}

/* ===== Base ===== */
.wrap{max-width:1320px;margin:0 auto;padding:26px 20px 70px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font:700 38px/1 var(--ff-h);color:#120005}
.page-h .sub{margin:6px 0 0;color:var(--muted);max-width:70ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);transition:transform 160ms ease-out,background-color 150ms ease,border-color 150ms ease}
.btn .ic{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--vino-btn);border-color:#8a0018;color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-danger{color:var(--bad);border-color:#EDC4CB}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--r);cursor:pointer;color:var(--muted);transition:transform 160ms ease-out,background-color 150ms ease}
.ib:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{border-color:#AEB6C2;background:#FAFBFC}
  .btn-pri:hover{background:linear-gradient(90deg,#5a0010 0%,#9c001a 100%);border-color:#6e0014}
  .btn-ghost:hover{background:var(--navy-soft);border-color:transparent}
  .btn-danger:hover{background:var(--bad-soft);border-color:#E3A5B0}
  .ib:hover{background:var(--navy-soft);color:var(--navy)}
  .tab:hover{color:#fff}
  .lockbtn:hover{background:#f6eef0}
  body.is-admin .lockbtn:hover{background:#d3eee3}
  .tbl tbody tr:hover{background:#F6F8FB}
  .leg:hover,.pbar:hover,.att-i:hover{background:var(--navy-soft)}
}
:focus-visible{outline:2px solid #b0001e;outline-offset:2px}

.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px #12000510,0 4px 14px -8px #12000522}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap;flex-shrink:0;line-height:1.5}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.c-ok{color:var(--ok);background:var(--ok-soft)}
.c-warn{color:var(--warn);background:var(--warn-soft)}
.c-bad{color:var(--bad);background:var(--bad-soft)}
.c-res,.c-sin{color:var(--res);background:var(--res-soft)}
.c-crit{color:var(--navy);background:var(--navy-soft)}
.c-critA{color:#fff;background:var(--navy)}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}.s-sin,.s-res{color:var(--faint)}
.b-ok{background:#2E9A65}.b-warn{background:#D99A2B}.b-bad{background:var(--red)}.b-res,.b-sin{background:#8D9AB2}
.sm{font-size:12.5px;color:var(--muted)}
.muted{color:var(--faint)}
.note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy-soft);border:1px solid #EBCBD2;color:var(--navy);padding:10px 14px;border-radius:8px;margin-bottom:18px}
.note p{margin:0;flex:1 1 300px}
.note.warn{background:var(--warn-soft);border-color:#EDD3A6;color:#6E4508}

/* ===== Barra de estados ===== */
.sbar{margin-bottom:18px}
.sbar-track{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:#E6E9EE}
.sbar-track span{min-width:6px}
.sbar-leg{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px}
.leg{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;padding:4px 10px 4px 8px;border-radius:var(--r);cursor:pointer;color:var(--ink);transition:background-color 150ms ease,border-color 150ms ease}
.leg i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg b{font:600 17px/1 var(--ff-h);font-variant-numeric:tabular-nums}
.leg.on{background:#fff;border-color:var(--navy)}

/* ===== Inventario ===== */
.inv-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:stretch}
.inv-top .side{margin:0}
.filt{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.srch{position:relative;flex:1 1 220px;min-width:0}
.srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.srch input{padding-left:32px}
.filt select{flex:0 1 170px;min-width:0}
input,select,textarea{height:38px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;background:#fff;min-width:0;width:100%;transition:border-color 150ms ease}
select{padding-right:6px}
textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6e0014;box-shadow:0 0 0 3px rgba(176,0,30,.14)}
input[readonly]{background:var(--bg-2);color:var(--muted)}
.tbl-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--navy-2);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{text-align:left;font-weight:600;font-size:13px;color:#fff;padding:10px 12px;border-bottom:0;background:#2a0008;white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button[aria-sort]::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.tbl th button[aria-sort="ascending"]::after{transform:rotate(180deg)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
.tbl tbody tr{cursor:pointer;transition:background-color 120ms ease}
.tbl tbody tr:last-child td{border-bottom:0}
.mid{font:700 17px/1.2 var(--ff-h);color:#6e0014;white-space:nowrap;font-variant-numeric:tabular-nums}
.t2{font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pot{white-space:nowrap}
.mid{overflow:hidden;text-overflow:ellipsis;display:block}
.medcell{display:flex;align-items:flex-start;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h2,.empty h1{font:600 24px/1.15 var(--ff-h);color:var(--navy);margin-bottom:8px}
.empty p{max-width:52ch;margin:0 auto 16px}
.empty .acts{justify-content:center}

.side h2{font:700 21px/1.15 var(--ff-h);color:#120005;margin:0 0 4px}
.side .sec-b{padding:14px 16px}
.att{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.att-i{display:grid;grid-template-columns:8px minmax(0,1fr);gap:4px 10px;padding:9px 8px;margin:0 -8px;border-radius:var(--r);cursor:pointer;width:calc(100% + 16px);background:none;border:0;text-align:left;transition:background-color 150ms ease}
.att-i .dot{margin-top:5px}
.att-i b{font:600 15px/1.2 var(--ff-h);color:var(--navy)}
.att-i span{display:block;font-size:12.5px;color:var(--muted)}
.att-i em{font-style:normal}
.att-more{margin-top:6px}
.pbar{display:block;width:calc(100% + 16px);margin:0 -8px;padding:8px;border:0;background:none;text-align:left;cursor:pointer;border-radius:var(--r);transition:background-color 150ms ease}
.pbar.on{background:var(--navy-soft)}
.pbar-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pbar-t span{font-weight:500;min-width:0}
.pbar-t b{font:600 16px var(--ff-h);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar-b{height:6px;background:#E6E9EE;border-radius:3px;margin:6px 0 3px;overflow:hidden}
.pbar-b i{display:block;height:100%;background:var(--vino-btn);border-radius:3px;transform-origin:left}

/* ===== Ficha ===== */
.ftool{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ftool-r{display:flex;gap:8px;flex-wrap:wrap}
.fh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:22px 24px;margin-bottom:16px}
.fh-id{font:700 17px/1 var(--ff-h);color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.fh h1{font:600 34px/1.05 var(--ff-h);color:var(--navy);margin:8px 0 6px;overflow-wrap:anywhere}
.fh-loc{color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.fh-chips{display:flex;gap:6px;flex-wrap:wrap}
.fh-qr{display:flex;flex-direction:column;align-items:center;gap:6px;width:132px}
.fh-qr > svg{width:120px;height:120px;display:block}
.fh-qr .sm{text-align:center}
.fh-qr .row{display:flex;gap:2px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px #12000510,0 4px 14px -8px #12000522;min-width:0;max-width:100%}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.sec-h h2{font:700 21px/1.15 var(--ff-h);color:#120005}
.sec-b{padding:16px 18px}
.kv{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:9px 16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv dd.muted{font-weight:400}

.plate{background:#ECEEF1;border:1px solid #C3C9D2;border-radius:6px;padding:16px 14px 14px;position:relative;box-shadow:inset 0 1px 0 #fff}
.rv{position:absolute;width:8px;height:8px;border-radius:50%;background:#C2C8D1;border:1px solid #98A1AE;box-shadow:inset 0 1px 0 #fff}
.rv:nth-child(1){top:6px;left:6px}.rv:nth-child(2){top:6px;right:6px}.rv:nth-child(3){bottom:6px;left:6px}.rv:nth-child(4){bottom:6px;right:6px}
.plate-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--navy);padding:0 6px 8px;margin:0 8px 10px}
.plate-h b{font:700 14px/1.2 var(--ff-h);letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
.plate-h span{font:600 13px var(--ff-h);letter-spacing:.06em;text-transform:uppercase;color:#4E5868;white-space:nowrap}
.plate-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #C3C9D2;border-left:1px solid #C3C9D2;margin:0 8px 4px}
.pc{border-right:1px solid #C3C9D2;border-bottom:1px solid #C3C9D2;padding:6px 9px 7px;min-width:0}
.pc small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#5A6474;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc b{display:block;font:600 18px/1.2 var(--ff-h);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pc.e b{color:#A3AAB5;font-weight:500}
.plate.anim .pc{animation:pcIn 260ms var(--ease-out) both}
@keyframes pcIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.cyc + .cyc{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cyc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cyc-n{font:600 17px var(--ff-h);color:var(--ink);display:flex;align-items:center;gap:7px}
.cyc-n .ic{color:var(--navy-2);width:17px;height:17px}
.cyc-bar{height:6px;background:#E6E9EE;border-radius:3px;margin:10px 0 8px;overflow:hidden}
.cyc-bar i{display:block;height:100%;width:100%;transform-origin:left;border-radius:3px}
.cyc-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.cyc-meta b{color:var(--ink);font-weight:500}

.mets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.met{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.met-l{font-size:12.5px;color:var(--muted)}
.met-v{font:600 24px/1.15 var(--ff-h);font-variant-numeric:tabular-nums;margin:2px 0}
.met-v small{font:500 14px var(--ff);color:var(--muted);margin-left:3px}
.met-n{font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:flex-start}
.met-n .dot{margin-top:5px}
.med-date{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:13px}
.ref{margin:12px 0 0;font-size:12px;color:var(--faint)}

.hl{list-style:none;margin:0;padding:0}
.hl li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hl li:first-child{padding-top:0}
.hl li:last-child{border-bottom:0;padding-bottom:0}
.hl-d{font:600 15px/1.3 var(--ff-h);color:var(--navy);font-variant-numeric:tabular-nums}
.hl-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.hl-x{overflow-wrap:anywhere;white-space:pre-line}
.hl .ib{width:28px;height:28px}
.tag{font-size:12px;font-weight:600;color:var(--navy);background:var(--navy-soft);padding:1px 8px;border-radius:4px;white-space:nowrap}
.mtab{width:100%;border-collapse:collapse;font-size:13px}
.mtab th{text-align:right;font-weight:500;color:var(--muted);padding:0 8px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left;padding-left:0}
.mtab td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtab tr:last-child td{border-bottom:0}
.mtab td:last-child,.mtab th:last-child{padding-right:0}
.scrollx{overflow-x:auto;max-width:100%}
.docs{display:flex;flex-direction:column;gap:12px}
.docs img{max-width:100%;max-height:340px;border-radius:6px;border:1px solid var(--line);display:block;object-fit:contain;background:var(--bg-2)}
.docs a{color:var(--navy-2);font-weight:500;overflow-wrap:anywhere;display:inline-flex;gap:6px;align-items:center}
.loading{padding:70px 20px;text-align:center;color:var(--muted)}
.lbar{width:180px;height:4px;background:#E2E6EC;border-radius:2px;margin:0 auto 14px;overflow:hidden}
.lbar i{display:block;width:40%;height:100%;background:var(--navy-2);border-radius:2px;animation:lb 1.1s linear infinite}
@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* ===== Etiquetas ===== */
.etq-cfg{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto;gap:16px 20px;padding:16px 18px;margin-bottom:16px;align-items:start}
.etq-cfg .row{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;height:36px;padding:0 12px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--line-2);transition:background-color 150ms ease,color 150ms ease}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--vino-btn);color:#fff}
.help{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.help.warn{color:var(--warn)}
.help code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.etq-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.etq-list .filt{flex-direction:column}
.etq-list .srch{flex:none}
.etq-list .filt select{flex:1 1 auto}
.chk-l{max-height:560px;overflow:auto}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.chk input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--navy)}
.chk b{font:600 15px/1.2 var(--ff-h);color:var(--navy)}
.chk span{display:block;font-size:12.5px;color:var(--muted)}
.etq-pv-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.etq-pv-h b{font:600 18px var(--ff-h);color:var(--navy)}
.etq-pv{padding:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;background:repeating-linear-gradient(0deg,#F6F7F9 0 1px,transparent 1px 10mm),repeating-linear-gradient(90deg,#F6F7F9 0 1px,transparent 1px 10mm),#FBFBFC;min-height:260px;overflow-x:auto}
.etq-pv .lbl{box-shadow:0 1px 3px rgba(42,0,8,.16);outline:1px solid var(--line-2)}
.pv-more{align-self:center;color:var(--muted)}

/* Etiqueta (medidas reales en mm) */
.lbl{background:#fff;color:#000;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;overflow:hidden;font-family:var(--ff);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid;flex-shrink:0}
.lbl-qr{grid-row:1;grid-column:1;display:flex;align-items:center;justify-content:center}
.lbl-qr svg{display:block;width:100%;height:100%}
.lbl-noqr{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #9AA3AF;color:#6B7483;font-size:7pt;padding:2mm}
.lbl-body{grid-row:1;grid-column:2;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lbl-brand{font-family:var(--ff-h);font-weight:700;color:var(--red);line-height:1}
.lbl-id{font-family:var(--ff-h);font-weight:700;color:var(--navy);line-height:1.02;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.lbl-name{font-weight:500;line-height:1.18;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;color:#111}
.lbl-loc,.lbl-spec{color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.lbl-foot{grid-column:1/-1;grid-row:2;background:linear-gradient(90deg,#120005 0%,#2a0008 40%,#6e0014 80%,#b0001e 100%);color:#fff;display:flex;align-items:center;gap:1.6mm;white-space:nowrap;overflow:hidden}
.lbl-foot i{width:1.5mm;height:1.5mm;background:#fff;flex-shrink:0}
.lbl-s{width:50mm;height:30mm;padding:1.4mm;column-gap:1.4mm}
.lbl-s .lbl-qr{width:27.2mm;height:27.2mm}
.lbl-s .lbl-brand{font-size:6pt;margin-bottom:.8mm}
.lbl-s .lbl-id{font-size:9pt;margin-bottom:.8mm}
.lbl-s .lbl-name{font-size:5.6pt;-webkit-line-clamp:3}
.lbl-s .lbl-loc{font-size:5.2pt;margin-top:.6mm}
.lbl-m{width:70mm;height:40mm;column-gap:2mm}
.lbl-m .lbl-qr{width:31mm;height:31mm;margin:1.5mm 0 1.5mm 1.5mm}
.lbl-m .lbl-body{padding:1.5mm 2mm 1.5mm 0}
.lbl-m .lbl-brand{font-size:7pt;margin-bottom:1mm}
.lbl-m .lbl-id{font-size:13pt;margin-bottom:1mm}
.lbl-m .lbl-name{font-size:7pt}
.lbl-m .lbl-loc{font-size:6.2pt;margin-top:1mm}
.lbl-m .lbl-foot{height:5.5mm;padding:0 2.5mm;font-size:6pt}
.lbl-l{width:100mm;height:60mm;column-gap:3mm}
.lbl-l .lbl-qr{width:47mm;height:47mm;margin:3mm 0 3mm 3mm}
.lbl-l .lbl-body{padding:3mm 3mm 3mm 0}
.lbl-l .lbl-brand{font-size:9pt;margin-bottom:1.5mm}
.lbl-l .lbl-id{font-size:19pt;margin-bottom:1.6mm}
.lbl-l .lbl-name{font-size:9.5pt;-webkit-line-clamp:3}
.lbl-l .lbl-loc{font-size:8pt;margin-top:1.6mm}
.lbl-l .lbl-spec{font-size:8pt;margin-top:.6mm}
.lbl-l .lbl-foot{height:7mm;padding:0 3mm;font-size:7.5pt}
.lbl-x{width:120mm;height:26mm;padding:1.4mm 2mm 1.4mm 1.6mm;column-gap:0;grid-template-rows:minmax(0,1fr);font-family:Arial,'Liberation Sans',Helvetica,sans-serif;color:#000}
.lbl-x .lbl-qr{width:23.2mm;height:23.2mm}
.lx{grid-row:1;grid-column:2;min-width:0;border-left:.35mm solid #000;margin-left:1.4mm;padding-left:1.1mm;display:flex;flex-direction:column;justify-content:center;gap:.55mm;height:22.4mm;align-self:center}
.lx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.lx1{font-weight:700;font-size:9.2pt}
.lx2{font-weight:700;font-size:7.8pt}
.lx3{font-size:7.8pt}
.lx4{font-size:6.3pt}
#print-area{display:none}
.ver{max-width:1400px;margin:0 auto;padding:6px 24px 18px;font-size:11.5px;color:var(--faint);text-align:right}
body.has-dock .ver{padding-bottom:118px}
body.has-dock main.wrap{padding-bottom:16px!important}
.medtxt{color:var(--ink)}
.eqp-a{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.ly-sh .ly-add{flex-shrink:0}
@media (max-width:560px){.eqp-a{justify-content:flex-start}.ly-sh .ly-add{width:100%;justify-content:center}}

.esl{list-style:none;margin:0;padding:0}
.esl li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.esl li:first-child{padding-top:0}.esl li:last-child{border-bottom:0;padding-bottom:0}
.es-dt{display:flex;align-items:center;gap:10px}
.es-dt span{display:flex;flex-direction:column;line-height:1.15}
.es-dt small{font-size:11.5px;color:var(--muted)}
.es-dt b{font:700 16px var(--ff-h);color:#120005;font-variant-numeric:tabular-nums;white-space:nowrap}
.es-dt svg{width:18px;height:18px;fill:none;stroke:#b0001e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.esl li.open .es-dt span:last-child b{color:#8a5a00}
.es-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.es-r{display:flex;align-items:center;gap:10px;justify-self:end}
.es-d{font:700 14px var(--ff-h);padding:3px 10px;border-radius:999px;background:#EEF0F3;color:#3d4350;white-space:nowrap}
.es-d.w{background:#FDF1DC;color:#8a5a00}
body.dark .es-dt b{color:#F1E8EA}
@media (max-width:600px){.esl li{grid-template-columns:minmax(0,1fr)}.es-r{justify-self:start}}

body.solo .tabs{display:none!important}
body:not(.is-admin) .adm-only{display:none!important}
/* ===== Inicio del layout ===== */
body.has-dock .wrap{padding-bottom:124px}
.dock{transition:transform 280ms var(--ease-out),opacity 200ms ease}
.dock.hid{transform:translate(-50%,calc(100% + 28px));opacity:0;pointer-events:none}
.ly-hero{position:relative;overflow:hidden;background:var(--vino-card);color:#fff;border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end;margin-bottom:26px;box-shadow:0 16px 34px -20px #120005}
.ly-hero .kpi-bg{font-size:150px;bottom:-42px;right:-8px}
.ly-hh{position:relative;min-width:0}
.ly-hh h1{font:800 42px/1 var(--ff-h);margin:0;color:#fff}
.ly-hh p{margin:10px 0 0;color:var(--rosa);max-width:60ch;font-size:14.5px;line-height:1.45}
.ly-sts{position:relative;display:grid;grid-template-columns:repeat(4,auto);border-radius:12px;background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.ly-st{padding:12px 20px;min-width:104px}
.ly-st + .ly-st{border-left:1px solid rgba(255,255,255,.12)}
.ly-st b{display:block;font:800 30px/1.05 var(--ff-h);font-variant-numeric:tabular-nums}
.ly-st span{font-size:12.5px;color:var(--rosa);white-space:nowrap}
.ly-sw{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:16px;padding:4px;border-radius:11px;background:rgba(0,0,0,.24)}
.ly-sw button{border:0;background:transparent;color:#f3dfe3;font:700 16px var(--ff-h);padding:8px 16px;border-radius:8px;cursor:pointer;transition:background-color 150ms ease,color 150ms ease,transform 160ms ease-out}
.ly-sw button:active{transform:scale(.97)}
.ly-sw button[aria-current="page"]{background:#fff;color:#6e0014}
.ly-sec{margin-bottom:34px}
.ly-sh{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #120005}
.ly-ic{width:42px;height:42px;fill:none;stroke:#6e0014;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ly-sht{flex:1;min-width:0}
.ly-sht h2{margin:0;font:800 28px/1.05 var(--ff-h);color:#120005}
.ly-sht p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.ly-sh .btn{flex-shrink:0}
.ly-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ly-cnt{font:700 19px var(--ff-h);color:#120005}
.ly-seg{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:#fff}
.ly-seg span{font-size:12.5px;color:var(--muted);padding:0 8px 0 7px}
.ly-seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font:600 13.5px var(--ff);color:var(--ink);cursor:pointer;transition:background-color 150ms ease,color 150ms ease,transform 160ms ease-out}
.ly-seg button:active{transform:scale(.97)}
.ly-seg button[aria-pressed="true"]{background:#6e0014;color:#fff}
.ly .lcards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.ly .lcard{gap:6px;padding:18px 18px 15px;border-radius:14px;transition:transform 220ms var(--ease-out),box-shadow 220ms ease,border-color 150ms ease}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.ly .lc-id{font-size:32px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.lc-st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.lcs-ok{background:#E7F5EE;color:#17794f}.lcs-warn{background:#FDF1DC;color:#8a5a00}.lcs-bad{background:#FBE4E8;color:#a3122d}.lcs-sin{background:#EEF0F3;color:#5A6474}
.ly .lc-mini{height:96px;margin:8px 0 6px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,#fbf7f8,#fff)}
.ly .lc-mini .lsvg{width:100%;height:100%}
.ly .lc-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:11px}
.lc-k{min-width:0}
.ly .lc-k b{display:block;font:800 24px/1 var(--ff-h);color:#120005;font-variant-numeric:tabular-nums;white-space:nowrap}
.ly .lc-k b em{font-style:normal;font-size:14px;color:var(--muted);font-weight:700}
.lc-k small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.lc-sh{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.lc-bar{height:6px;border-radius:3px;background:#EEF0F3;overflow:hidden}
.lc-bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#6e0014,#c4002a);border-radius:3px;transform-origin:left}
.lc-sh small{font-size:11.5px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){
  .ly .lcard:hover{transform:translateY(-4px);border-color:#dcbcc3;box-shadow:0 20px 34px -20px #6e0014}
  .ly .lcard:hover .lc-id{color:#b0001e}
  .ly-sw button:not([aria-current="page"]):hover{background:rgba(255,255,255,.12)}
  .ly-seg button:not([aria-pressed="true"]):hover{background:#F7EAED}
}
.ly.first .ly-hero{animation:rise 650ms var(--ease-expo) both}
.ly.first .ly-st{animation:riseS 650ms var(--ease-expo) both;animation-delay:calc(160ms + var(--k,0) * 80ms)}
.ly-st:nth-child(2){--k:1}.ly-st:nth-child(3){--k:2}.ly-st:nth-child(4){--k:3}
.ly.first .ly-sw,.ly.first .ly-bar{animation:fadeIn 500ms ease 260ms both}
.ly.first .ly-sh{animation:slideIn 600ms var(--ease-expo) both;animation-delay:calc(260ms + var(--s,0) * 240ms)}
.ly.first .lcard{animation:rise 650ms var(--ease-expo) both;animation-delay:calc(320ms + var(--s,0) * 240ms + var(--i,0) * 60ms)}

@media (hover:hover) and (pointer:fine){.ly-tab:not(.on):hover{transform:translateY(-3px);border-color:#dcbcc3;box-shadow:0 16px 30px -18px #6e0014}.ly-tab:not(.on):hover .ly-chev{opacity:1}}

.ly-sec.anim .lcard .fleje,.ly-sec.anim .lcard .tubo-out,.ly-sec.anim .lcard .tubo-in{stroke-dasharray:1;animation:draw 1100ms var(--ease-expo) both;animation-delay:calc(240ms + var(--i,0) * 55ms)}

@media (prefers-reduced-motion:reduce){.ly-sec.anim *,.ly-pick svg{animation:none!important}}

/* ===== Modales ===== */

.bdg{stroke:#fff;stroke-width:2}
.bdg.b-ok{fill:#2E9A65}.bdg.b-warn{fill:#D99A2B}.bdg.b-bad{fill:#C8102E}.bdg.b-sin{fill:#8D9AB2}
.bdg-t{fill:#fff;font:700 12px var(--ff);text-anchor:middle;stroke:none}
.leg-l{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 18px 0;font-size:12.5px;color:var(--muted)}

.leg-l i{width:10px;height:10px;border-radius:50%}
.mob-only{display:none!important}
@media (max-width:760px){.mob-only{display:inline-flex!important;color:#6e0014;font-weight:600}}
.auxs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.auxc{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;transition:border-color 150ms ease,background-color 150ms ease}
.auxc.on{border-color:#b0001e;background:#F7EAED}
.ax-c{font-size:11.5px;color:var(--muted);grid-column:1}
.ax-n{font:700 15px/1.2 var(--ff-h);color:#120005;grid-column:1}
.ax-b{grid-column:2;grid-row:1/3;min-width:26px;height:26px;border-radius:13px;color:#fff;font:700 13px/26px var(--ff);text-align:center;padding:0 7px}
.ax-0{grid-column:2;grid-row:1/3;font-size:12px;color:var(--faint)}
.eqp{scroll-margin-top:80px}

.eqp-h h2{font:700 24px/1.1 var(--ff-h);color:#120005}
.eqp-c{font-size:12.5px;color:#6e0014;font-weight:600}
@media (max-width:860px){.pcards{grid-template-columns:minmax(0,1fr)}.pcard{min-height:130px}.lcards{grid-template-columns:minmax(0,1fr)}}

/* ===== Menú de líneas ===== */
.lnav{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px;box-shadow:0 1px 2px #12000510,0 4px 14px -8px #12000522}
.ln-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ln-home{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;border:0;background:var(--vino-head);color:#fff;font:700 16px var(--ff-h);cursor:pointer;transition:transform 160ms ease-out}
.ln-home:active{transform:scale(.97)}
.ln-home .ic{width:17px;height:17px}
.ln-pl{display:flex;gap:4px;background:#F4F5F7;border-radius:9px;padding:3px}
.ln-pl button{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#394252;font:700 15.5px var(--ff-h);cursor:pointer;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease}
.ln-pl button b{font:600 12px var(--ff);color:var(--muted);background:#fff;border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.ln-pl button[aria-current="page"]{background:#fff;color:#6e0014;box-shadow:0 1px 3px #12000526}
.ln-pl button[aria-current="page"] b{background:#F7EAED;color:#6e0014}
.ln-lines{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.ln-lbl{font-size:12.5px;color:var(--muted);margin-right:4px;flex-shrink:0}
.ln-lines button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:99px;background:#fff;color:#120005;font:700 16px var(--ff-h);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color 150ms ease,background-color 150ms ease}
.ln-lines button i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ln-lines button small{font:600 12px var(--ff);color:var(--muted);font-variant-numeric:tabular-nums}
.ln-lines button[aria-current="page"]{background:var(--vino-btn);border-color:#8a0018;color:#fff}
.ln-lines button[aria-current="page"] small{color:#ffd0d6}
.ln-none{font-size:13px;color:var(--faint)}
@media (hover:hover) and (pointer:fine){.ln-pl button:hover{color:#6e0014}.ln-lines button:hover{border-color:#e3b3bd;background:#fff8f9}.ln-lines button[aria-current="page"]:hover{background:var(--vino-btn)}}
@media (max-width:760px){
  .lnav{padding:8px;margin:0 -4px 14px}
  .ln-top{flex-wrap:nowrap;gap:8px}
  .ln-home{width:38px;padding:0;justify-content:center;flex-shrink:0}
  .ln-home span{display:none}
  .ln-pl{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
  .ln-pl button{padding:0 4px;justify-content:center;font-size:14.5px;gap:4px;min-width:0;overflow:hidden}
  .ln-pl button b{display:none}
  .ln-lbl{display:none}
  .ln-lines{margin:8px -8px 0;padding:8px 8px 2px;-webkit-mask-image:linear-gradient(90deg,#000 95%,transparent);mask-image:linear-gradient(90deg,#000 95%,transparent)}
}
.maq.vacio .rot{fill:#6B7483}
.maq.vacio .cod{fill:#8C95A4}

/* ===== Menú inferior (dock) ===== */
body.has-dock .wrap{padding-bottom:130px}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px)}
.dk-bar{display:flex;gap:4px;background:var(--vino-head);border-radius:16px;padding:6px;box-shadow:0 14px 34px -10px rgba(18,0,5,.6),0 0 0 1px rgba(255,255,255,.08) inset}
.dk-b{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:0;border-radius:11px;background:transparent;color:#fff;cursor:pointer;text-align:left;min-width:0;transition:background-color 150ms ease,transform 160ms ease-out}
.dk-b:active{transform:scale(.97)}
.dk-b span{min-width:0}
.dk-b small{display:block;font-size:11.5px;color:var(--rosa);line-height:1.1}
.dk-b b{display:block;font:700 18px/1.15 var(--ff-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-b .ic{width:16px;height:16px;opacity:.85;transition:transform 200ms var(--ease-out)}
.dk-b[aria-expanded="true"]{background:rgba(255,255,255,.16)}
.dk-b[aria-expanded="true"] .ic{transform:rotate(180deg)}
.dk-home{font:700 17px var(--ff-h);background:rgba(255,255,255,.1)}
.dk-home .ic{width:19px;height:19px;opacity:1}
.dk-pop{background:#fff;border-radius:16px;box-shadow:0 18px 44px -12px rgba(18,0,5,.45),0 0 0 1px #E2E5EA;width:min(440px,calc(100vw - 24px));max-height:min(60vh,480px);overflow:auto;padding:8px;transform-origin:bottom center;animation:dkIn 200ms var(--ease-out) both}
@keyframes dkIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.dk-h{font:700 15px var(--ff-h);color:#6e0014;padding:8px 10px 6px}
.dk-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink);transition:background-color 150ms ease}
.dk-i b{display:block;font:700 18px/1.15 var(--ff-h);color:#120005}
.dk-i small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-i em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dk-i[aria-current="page"]{background:#F7EAED}
.dk-i[aria-current="page"] b{color:#6e0014}
.dk-dot{width:10px;height:10px;border-radius:50%}
.dk-ic{width:30px;height:30px;fill:none;stroke:#6e0014;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dk-none{margin:4px 10px 10px;font-size:13.5px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.dk-b:hover{background:rgba(255,255,255,.12)}.dk-i:hover{background:#FBF3F5}}
@media (max-width:760px){
  body.has-dock .wrap{padding-bottom:110px}
  .dock{left:0;right:0;bottom:0;transform:none;width:auto;max-width:none;padding:0 8px calc(8px + env(safe-area-inset-bottom));align-items:stretch}
  .dk-bar{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);border-radius:16px}
  .dk-b{height:52px;padding:0 10px;justify-content:space-between}
  .dk-home{justify-content:center;width:52px;padding:0}
  .dk-home span{display:none}
  .dk-pop{width:auto;max-height:62vh}
}
@media print{#dockwrap{display:none}}

/* ===== Panel de dirección ===== */
:root{--s1:#a3263f;--s2:#2a78d6;--s3:#eda100;--s4:#6250d6;--ok-c:#22a06b;--warn-c:#e39b16;--bad-c:#d3193a;--res-c:#8D9AB2;--card:#fff;--track:#EEF0F3;--tip-bg:#120005;--tip-fg:#fff;--h-c:#120005;--hov:#FBF3F5;--ease-expo:cubic-bezier(.16,1,.3,1)}
.pnl{display:flex;flex-direction:column;gap:18px}
.hero{position:relative;border-radius:24px;padding:28px 28px 24px;color:var(--ink);background:
  radial-gradient(60% 90% at 100% 0%,rgba(176,0,30,.10) 0%,rgba(176,0,30,0) 60%),
  radial-gradient(50% 80% at 0% 100%,rgba(110,0,20,.06) 0%,rgba(110,0,20,0) 60%),
  linear-gradient(180deg,#fff 0%,#fff7f8 100%);
  border:1px solid #f1dfe3;box-shadow:0 1px 2px #12000508,0 24px 50px -34px #6e001455}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,#2a0008,#6e0014 40%,#b0001e 100%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero-k{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#a3263f;background:#fbecef;border:1px solid #f3d3da;border-radius:99px;padding:3px 10px 3px 8px;margin-bottom:10px}
.hero-k .ic{width:14px;height:14px}
.hero-t h1{font:800 42px/1 var(--ff-h);color:#120005;letter-spacing:.003em}
.hero-t p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.hero-u{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border:1px solid #efdde1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:9px 14px;box-shadow:0 6px 18px -12px #6e001440}
.hero-u small{display:block;font-size:11.5px;color:var(--muted)}
.hero-u b{font:700 16px var(--ff-h);white-space:nowrap;color:#120005}
.pulse{width:9px;height:9px;border-radius:50%;background:#22a06b;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,160,107,.5)}70%{box-shadow:0 0 0 9px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}
.pf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:22px 0 20px}
.pf-f{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:0 1 190px}
.pf-f span{font-size:12px;color:var(--muted);font-weight:500}
.pf select,.pf input{height:40px;background:rgba(255,255,255,.85);border:1px solid #e6d3d8;border-radius:12px;box-shadow:0 1px 2px #12000508}
.pf-x{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:12px;border:1px solid #e6d3d8;background:#fff;color:#a3263f;font-weight:600;cursor:pointer;transition:background-color 150ms ease,transform 160ms ease-out}
.pf-x .ic{width:15px;height:15px}
.pf-x:active{transform:scale(.97)}
.pf-per{margin-left:auto;font-size:12.5px;color:var(--muted);align-self:center}
.pks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pk{position:relative;background:rgba(255,255,255,.78);border:1px solid #f0e2e5;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:14px 15px 13px;min-width:0;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px #12000508,0 12px 26px -20px #6e001450;transition:transform 260ms var(--ease-expo),box-shadow 260ms ease,border-color 200ms ease;outline:none;overflow:hidden}
.pk::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--pk-c,transparent);opacity:.9}
.pk-ok{--pk-c:linear-gradient(90deg,#22a06b,#5fd49b)}.pk-warn{--pk-c:linear-gradient(90deg,#e08a00,#ffc24d)}.pk-bad{--pk-c:linear-gradient(90deg,#c8102e,#ff5c78)}
.pk:focus-visible{border-color:#b0001e}
.pk header{display:flex;align-items:center;gap:8px}
.pk-ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fbecef,#f6dce2);color:#a3263f;flex-shrink:0}
.pk-ico .ic{width:15px;height:15px}
.pk-l{font-size:13px;color:var(--muted);font-weight:500;line-height:1.25;flex:1;min-width:0}
.pk-i{width:17px;height:17px;border-radius:50%;border:1px solid #dcc9ce;font:600 10.5px/15px var(--ff);text-align:center;color:var(--muted);flex-shrink:0}
.pk-v{font:800 38px/1.02 var(--ff-h);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:3px;color:#120005;margin-top:2px}
.pk-v small{font:700 18px var(--ff-h);color:var(--muted);margin-left:1px}
.pk-pre{font:700 24px Arial,'Liberation Sans',sans-serif;color:var(--muted);margin-right:3px}
.q{font-family:Arial,'Liberation Sans',sans-serif;font-size:.92em;color:var(--muted);margin-right:2px}
.pk-e{font-size:26px;color:#b9a9ae}
.pk-bad .pk-v .cu{color:#c8102e}.pk-warn .pk-v .cu{color:#b86e00}
.pk-s{font-size:12.5px;color:var(--muted);line-height:1.35}
.pk-m{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.pk-bar{flex:1;height:7px;border-radius:4px;background:var(--track);position:relative}
.pk-bar i{display:block;height:100%;width:var(--w);border-radius:4px;transform-origin:left}
.pk-bar b{position:absolute;top:-3px;width:3px;height:13px;background:#120005;border-radius:2px;transform:translateX(-1px)}
.g-ok{background:linear-gradient(90deg,#22a06b,#5fd49b)}.g-warn{background:linear-gradient(90deg,#e08a00,#ffc24d)}.g-bad{background:linear-gradient(90deg,#c8102e,#ff5c78)}.g-sin{background:#c9cdd4}
.pk-sp{height:34px;margin:2px -2px 0}
.spk{width:100%;height:34px;display:block;overflow:visible}
.spk-l{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.dl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:1px;flex-wrap:wrap}
.dl em{font-style:normal;font-weight:500;color:var(--muted)}
.dl svg{width:11px;height:11px;fill:currentColor}
.dl-g{color:#18885a}.dl-b{color:#c8102e}.dl-n{color:var(--faint);font-weight:500}
@media (hover:hover) and (pointer:fine){.pk:hover{transform:translateY(-4px);box-shadow:0 2px 4px #12000510,0 22px 40px -22px #6e001466;border-color:#ead0d6}.pf-x:hover{background:#fbecef}}
.pg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid #efe6e8;border-radius:20px;padding:20px 22px;min-width:0;box-shadow:0 1px 2px #12000508,0 14px 34px -26px #6e001455;transition:transform 260ms var(--ease-expo),box-shadow 260ms ease}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px #12000510,0 24px 44px -26px #6e001470}}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{font:700 22px/1.15 var(--ff-h);color:var(--h-c)}
.ch-s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ch-empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:170px;padding:22px;color:var(--muted);font-size:13.5px;border:1.5px dashed #e8d9dd;border-radius:14px;background:linear-gradient(180deg,#fffafb,#fff)}
.pn-metas{grid-column:span 7}.pn-alert{grid-column:span 5}.pn-serv{grid-column:span 8}.pn-est{grid-column:span 4}.pn-kw{grid-column:span 6}.pn-cond{grid-column:span 6}.pn-rng,.pn-mar,.pn-cau{grid-column:span 4}.pn-tab{grid-column:span 12}
.lgd{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lgd li{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.lgd .tx{background:repeating-linear-gradient(135deg,var(--res-c) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--res-c)}
/* medidores */
.pn-metas{display:flex;flex-direction:column}
.ggs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;align-content:space-evenly}
.gg{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;gap:14px;padding:8px;border-radius:14px;outline:none;transition:background-color 150ms ease}
.gg:focus-visible{box-shadow:0 0 0 2px #b0001e}
.gg svg{width:170px;height:95px;grid-row:1;grid-column:1;overflow:visible}
.gg-t{fill:none;stroke:var(--track);stroke-width:14;stroke-linecap:round}
.gg-v{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--o);filter:drop-shadow(0 4px 6px rgba(110,0,20,.16))}
.gg-m{fill:#fff;stroke:#120005;stroke-width:2.5}
.gg-c{grid-row:1;grid-column:1;align-self:end;justify-self:center;padding-bottom:0;pointer-events:none;line-height:1}
.gg-c b{font:800 28px var(--ff-h);font-variant-numeric:tabular-nums;color:var(--h-c)}
.gg-c small{font-size:14px;margin-left:1px;color:var(--muted)}
.gg-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.gg-l b{font:700 18px/1.15 var(--ff-h);color:var(--h-c)}
.gg-l span{font-size:12.5px;color:var(--muted)}
.gg-st{display:inline-block;margin-top:4px;font-weight:600}
.st-ok{color:#18885a!important}.st-warn{color:#b86e00!important}.st-bad{color:#c8102e!important}.st-sin{color:var(--faint)!important}
@media (hover:hover) and (pointer:fine){.gg:hover{background:var(--hov)}}
/* alertas */
.ops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.op{display:grid;grid-template-columns:38px minmax(0,1fr) 16px;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid #f0e4e7;background:var(--card);cursor:pointer;color:var(--ink);position:relative;overflow:hidden;transition:transform 220ms var(--ease-expo),border-color 150ms ease,background-color 150ms ease,box-shadow 220ms ease}
.op::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--op-c)}
.op-bad{--op-c:#d3193a}.op-warn{--op-c:#e39b16}.op-info{--op-c:#8D9AB2}
.op:active{transform:scale(.985)}
.op>.ic:last-child{transform:rotate(180deg);color:var(--faint);width:15px;height:15px;transition:transform 220ms var(--ease-expo)}
.op-i{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.op-i .ic{width:18px;height:18px}
.op-bad .op-i{background:linear-gradient(135deg,#fde8ec,#fbd5dc);color:#c8102e}.op-warn .op-i{background:linear-gradient(135deg,#fff3dc,#ffe6b8);color:#b86e00}.op-info .op-i{background:linear-gradient(135deg,#eef1f6,#e1e6ef);color:#4A5A78}
.op b{display:block;font:700 16.5px/1.2 var(--ff-h);color:var(--h-c)}
.op small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px}
@media (hover:hover) and (pointer:fine){.op:hover{border-color:#ead0d6;background:var(--hov);transform:translateX(3px);box-shadow:0 10px 24px -18px #6e001460}.op:hover>.ic:last-child{transform:rotate(180deg) translateX(-3px);color:#a3263f}}
/* columnas */
.cc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;height:270px}
.cc-y{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--faint);text-align:right;padding-bottom:26px;font-variant-numeric:tabular-nums}
.cc-y span{line-height:0}
.cc-p{position:relative;min-width:0}
.cc-g{position:absolute;left:0;right:0;height:0;border-top:1px dashed #ebe3e5}
.cc-g:first-child{border-top:1px solid #dcd0d3}
.cc-cols{position:absolute;inset:0;display:flex;gap:4px}
.cc-c{flex:1;position:relative;min-width:0;outline:none;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:26px;transition:background-color 180ms ease}
.cc-c:hover,.cc-c:focus-visible{background:linear-gradient(180deg,rgba(163,38,63,0),rgba(163,38,63,.06))}
.cc-bar{position:relative;display:flex;flex-direction:column-reverse;gap:2px;width:min(70%,30px);margin:0 auto;transform-origin:bottom}
.cc-s{display:block;min-height:3px;border-radius:3px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))}
.cc-s:last-child{border-radius:8px 8px 3px 3px}
.cc-tot{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font:700 12px var(--ff);color:var(--h-c);opacity:0;transition:opacity 150ms ease,transform 200ms var(--ease-expo)}
.cc-c:hover .cc-tot,.cc-c:focus-visible .cc-tot{opacity:1;transform:translate(-50%,-2px)}
.cc-x{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
/* dona */
.dn{display:flex;flex-direction:column;align-items:center;gap:16px}
.dn-w{position:relative;width:190px;height:190px}
.dn svg{width:190px;height:190px;overflow:visible}
.dn-t{fill:none;stroke:var(--track);stroke-width:18}
.dn-s{fill:none;stroke-width:18;stroke-linecap:round;cursor:pointer;outline:none;transition:stroke-width 220ms var(--ease-expo),filter 220ms ease}
.dn-s:hover,.dn-s:focus-visible{stroke-width:24;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dn-c b{font:800 40px/1 var(--ff-h);color:var(--h-c);font-variant-numeric:tabular-nums}
.dn-c span{font-size:12.5px;color:var(--muted)}
.dn-lg{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dn-lg li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:#faf6f7;font-size:12.5px;color:var(--muted);transition:background-color 150ms ease}
.dn-lg li[data-a]{cursor:pointer}
.dn-lg li i{width:10px;height:10px;border-radius:50%;grid-row:1/3}
.dn-lg li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-lg li b{font:700 17px var(--ff-h);color:var(--h-c);grid-column:3;grid-row:1/3;font-variant-numeric:tabular-nums}
.dn-lg li em{font-style:normal;font-size:11.5px;grid-column:2}
@media (hover:hover) and (pointer:fine){.dn-lg li[data-a]:hover{background:#f6e9ec}}
/* barras píldora */
.pl{display:flex;flex-direction:column;gap:12px}
.pl-r{display:flex;flex-direction:column;gap:6px;width:100%;background:none;border:0;padding:6px 8px;margin:-6px -8px;border-radius:12px;text-align:left;color:var(--ink);cursor:pointer;transition:background-color 150ms ease;width:calc(100% + 16px)}
.pl-r[tabindex="-1"]{cursor:default}
.pl-r.on{background:var(--hov)}
.pl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pl-l{font:700 16px var(--ff-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--h-c)}
.pl-v{font:700 14px var(--ff);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--h-c)}
.pl-v em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-left:8px}
.pl-t{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.pl-t i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#c97b8b,#a3263f);transform-origin:left}
.pl-r.top .pl-t i{background:linear-gradient(90deg,#6e0014,#b0001e);box-shadow:0 0 12px rgba(176,0,30,.35)}
@media (hover:hover) and (pointer:fine){.pl-r:not([tabindex="-1"]):hover{background:var(--hov)}.pl-r:hover .pl-t i{filter:saturate(1.2) brightness(1.05)}}
/* barras apiladas de condición */
.sb{display:flex;flex-direction:column;gap:14px}
.sb-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sb-l{font:700 16px var(--ff-h);color:var(--h-c)}
.sb-v{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sb-v b{color:var(--h-c);font-variant-numeric:tabular-nums}
.sb-t{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;transform-origin:left}
.sb-s{display:block;min-width:5px;outline:none;transition:filter 150ms ease,transform 200ms var(--ease-expo)}
.sb-s:hover,.sb-s:focus-visible{filter:brightness(1.12) saturate(1.2)}
.sb-ok{background:linear-gradient(90deg,#22a06b,#5fd49b)}.sb-warn{background:linear-gradient(90deg,#e08a00,#ffc24d)}.sb-bad{background:linear-gradient(90deg,#c8102e,#ff5c78)}
.sb-sin{background:repeating-linear-gradient(135deg,#c3cad6 0 2px,#eef1f5 2px 6px)}
/* columnas de rangos */
.vc{display:flex;align-items:flex-end;gap:10px;height:230px;padding-top:6px;border-bottom:1px solid #dcd0d3}
.vc-c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative;outline:none;min-width:0;padding-bottom:24px}
.vc-b{width:min(100%,44px);border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#d04a63,#7a0f25);transform-origin:bottom;transition:filter 160ms ease}
.vc-c.mu .vc-b{background:repeating-linear-gradient(135deg,#c3cad6 0 3px,#eef1f5 3px 7px)}
.vc-v{font:700 15px var(--ff-h);color:var(--h-c);font-variant-numeric:tabular-nums}
.vc-x{position:absolute;bottom:0;font-size:11.5px;color:var(--muted);white-space:nowrap}
.vc-c:hover .vc-b,.vc-c:focus-visible .vc-b{filter:brightness(1.15)}
/* mapa de marcas */
.tm{position:relative;height:250px;border-radius:14px;overflow:hidden}
.tm-t{position:absolute;padding:3px;outline:none}
.tm-t::before{content:"";position:absolute;inset:3px;border-radius:10px;background:color-mix(in srgb,#8a1a32 var(--mix),#fbeef1);transition:filter 160ms ease,inset 220ms var(--ease-expo)}
.tm-t b,.tm-t span{position:relative;display:block;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-t b{font:700 15px/1.1 var(--ff-h);padding-top:9px;color:#5a1023}
.tm-t span{font-size:11.5px;color:#7a3a4a;margin-top:2px}
.tm-t.dk b{color:#fff}.tm-t.dk span{color:#f7d9df}
.tm-t.sm b{font-size:13px;padding-top:6px}.tm-t.sm span{display:none}
.tm-t.xs b{display:none}
.tm-t:hover::before,.tm-t:focus-visible::before{filter:brightness(1.12) saturate(1.15);inset:1px}
/* pareto */
.pr{display:flex;flex-direction:column;gap:10px}
.pr-r{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 26px 70px;align-items:center;gap:10px;outline:none;padding:4px 6px;margin:0 -6px;border-radius:10px;transition:background-color 150ms ease}
.pr-r:hover,.pr-r:focus-visible{background:var(--hov)}
.pr-l{font:700 15px var(--ff-h);color:var(--h-c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-t{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.pr-t i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#c97b8b,#a3263f);transform-origin:left}
.pr-r.vit .pr-t i{background:linear-gradient(90deg,#6e0014,#b0001e)}
.pr-v{font:700 14px var(--ff);text-align:right;color:var(--h-c);font-variant-numeric:tabular-nums}
.pr-c{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.pr-c i{display:block;height:3px;border-radius:2px;width:var(--w);background:#120005;opacity:.55}
.pr-c em{font-style:normal;font-variant-numeric:tabular-nums}
.pr-n{margin:6px 0 0;font-size:12px;color:var(--muted)}
/* tabla */
.ptab{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
.ptab th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf6f7}
.ptab th:first-child{border-radius:12px 0 0 12px}.ptab th:last-child{border-radius:0 12px 12px 0}
.ptab th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.ptab th button[aria-sort]{color:var(--h-c)}
.ptab th button[aria-sort]::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.ptab th button[aria-sort="ascending"]::after{transform:rotate(180deg)}
.ptab td{padding:12px;border-bottom:1px solid #f1eaec;font-size:13.5px;vertical-align:middle}
.ptab td.n{font-variant-numeric:tabular-nums;text-align:right}
.ptab th:nth-child(2) button,.ptab th:nth-child(3) button,.ptab th:nth-child(n+7) button{float:right}
.ptab tbody tr[data-a]{cursor:pointer;transition:background-color 150ms ease}
.ptab tbody tr:last-child td{border-bottom:0}
.tb-l{display:block;font:700 17px var(--ff-h);color:var(--h-c)}
.ptab td small{display:block;font-size:12px;color:var(--muted)}
.tb-p{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-b{width:76px;height:7px;border-radius:99px;background:var(--track);overflow:hidden;display:inline-block}
.tb-b i{display:block;height:100%;width:var(--w);border-radius:99px}
.tb-a{display:inline-block;min-width:24px;padding:1px 8px;border-radius:99px;background:#fde8ec;color:#c8102e;font-weight:700;text-align:center}
@media (hover:hover) and (pointer:fine){.ptab tbody tr[data-a]:hover{background:var(--hov)}}
.tip{position:fixed;left:0;top:0;z-index:95;max-width:280px;padding:9px 12px;border-radius:12px;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.45;white-space:pre-line;pointer-events:none;opacity:0;transition:opacity 140ms ease;box-shadow:0 14px 30px -12px rgba(18,0,5,.5)}
.tip.on{opacity:1}
/* entrada (solo la primera vez por sesión) */
.pnl.first .hero{animation:rise 700ms var(--ease-expo) both}
.pnl.first .pk{animation:riseS 700ms var(--ease-expo) both;animation-delay:calc(120ms + var(--n,0) * 60ms)}
.pnl.first .pk:nth-child(2){--n:1}.pnl.first .pk:nth-child(3){--n:2}.pnl.first .pk:nth-child(4){--n:3}.pnl.first .pk:nth-child(5){--n:4}.pnl.first .pk:nth-child(6){--n:5}
.pnl.first .card{animation:rise 760ms var(--ease-expo) both;animation-delay:calc(320ms + var(--n,0) * 70ms)}
.pnl.first .card:nth-child(2){--n:1}.pnl.first .card:nth-child(3){--n:2}.pnl.first .card:nth-child(4){--n:3}.pnl.first .card:nth-child(5){--n:4}.pnl.first .card:nth-child(6){--n:5}.pnl.first .card:nth-child(n+7){--n:6}
.pnl.first .pk-bar i{animation:growX 1200ms var(--ease-expo) 600ms both}
.pnl.first .spk-l{animation:draw 1400ms var(--ease-expo) 650ms both}
.pnl.first .spk-a{animation:fadeIn 900ms ease 1100ms both}
.pnl.first .spk-d{animation:pop 400ms var(--ease-expo) 1700ms both}
.pnl.first .gg-v{animation:gaugeIn 1500ms var(--ease-expo) 500ms both}
.pnl.first .gg-m{animation:pop 400ms var(--ease-expo) 1500ms both}
.pnl.first .cc-bar{animation:growY 900ms var(--ease-expo) both;animation-delay:calc(550ms + var(--i,0) * 45ms)}
.pnl.first .dn-s{animation:dnIn 1400ms var(--ease-expo) both;animation-delay:calc(550ms + var(--i,0) * 120ms)}
.pnl.first .dn-lg li{animation:rise 500ms var(--ease-expo) both;animation-delay:900ms}
.pnl.first .pl-t i{animation:growX 1100ms var(--ease-expo) both;animation-delay:calc(600ms + var(--i,0) * 70ms)}
.pnl.first .sb-t{animation:growX 1100ms var(--ease-expo) both;animation-delay:calc(620ms + var(--i,0) * 80ms)}
.pnl.first .vc-b{animation:growY 1000ms var(--ease-expo) both;animation-delay:calc(650ms + var(--i,0) * 70ms)}
.pnl.first .vc-v{animation:fadeIn 500ms ease both;animation-delay:calc(1100ms + var(--i,0) * 70ms)}
.pnl.first .tm-t{animation:tile 800ms var(--ease-expo) both;animation-delay:calc(650ms + var(--i,0) * 55ms)}
.pnl.first .pr-t i{animation:growX 1000ms var(--ease-expo) both;animation-delay:calc(650ms + var(--i,0) * 70ms)}
.pnl.first .ops li{animation:slideIn 600ms var(--ease-expo) both;animation-delay:calc(520ms + var(--i,0) * 60ms)}
.pnl.first .ptab tbody tr{animation:fadeIn 500ms ease both;animation-delay:calc(800ms + var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseS{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes tile{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes gaugeIn{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:var(--o)}}
@keyframes dnIn{from{stroke-dasharray:0 var(--c)}}
.gg-m,.spk-d{transform-box:fill-box;transform-origin:center}
.view-in{animation:fadeIn 240ms ease both}
@media (max-width:1180px){.pks{grid-template-columns:repeat(3,minmax(0,1fr))}.pn-metas,.pn-alert,.pn-serv,.pn-est,.pn-kw,.pn-cond{grid-column:span 12}.pn-rng,.pn-mar{grid-column:span 6}.pn-cau{grid-column:span 12}.dn{flex-direction:row;justify-content:center;gap:28px}.dn-lg{max-width:360px}}
@media (max-width:760px){
  .hero{padding:20px 16px 16px;border-radius:20px;margin:0 -4px}
  .hero-t h1{font-size:32px}
  .pf{gap:8px;margin:16px 0}.pf-f{flex:1 1 calc(50% - 8px);min-width:0}.pf-per{margin-left:0;width:100%}
  .pks{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pk{padding:12px;border-radius:16px}.pk-v{font-size:30px}.pk-ico{display:none}
  .pn-rng,.pn-mar{grid-column:span 12}
  .card{padding:16px;border-radius:18px}
  .ggs{grid-template-columns:minmax(0,1fr)}.gg{grid-template-columns:130px minmax(0,1fr)}.gg svg{width:130px;height:73px}.gg-c b{font-size:24px}
  .dn{flex-direction:column}.dn-w,.dn svg{width:170px;height:170px}
  .cc{height:230px}.cc-x{font-size:10px}
  .pr-r{grid-template-columns:minmax(70px,100px) minmax(0,1fr) 22px 54px}
}
.thbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;cursor:pointer;transition:background-color 150ms ease,transform 160ms ease-out}
.thbtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.thbtn:hover{background:rgba(255,255,255,.12)}}

body.dark .tm-t::before{background:color-mix(in srgb,#c4475e var(--mix),#2a1a1f)}body.dark .tm-t b{color:#fff}body.dark .tm-t span{color:#f1d4da}
body.dark .pr-c i{background:#F1E8EA}body.dark .ptab td{border-color:#2a1e22}body.dark .tb-a{background:rgba(200,16,46,.22);color:#FF8A98}
body.dark .dl-g{color:#4FD39A}body.dark .dl-b{color:#FF7A8C}

body.dark .pc b{color:#12161D}body.dark .pc.e b{color:#8C95A4}body.dark .lbl{color:#000}

/* ===== Responsivo ===== */
@media (max-width:1060px){
  .inv-top{grid-template-columns:minmax(0,1fr)}
  .etq-grid{grid-template-columns:minmax(0,1fr)}
  .etq-cfg{grid-template-columns:minmax(0,1fr)}
  .chk-l{max-height:300px}
}
@media (max-width:860px){
  .fgrid{display:flex;flex-direction:column}
  .fcol{display:contents}
  .fg,.md:not(.wide) .fg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .top-in{height:auto;flex-wrap:wrap;padding:10px 14px 0;gap:10px}
  .brand-t span{display:none}
  .tabs{order:3;width:calc(100% + 28px);margin:0 -14px;padding:0 4px;height:42px;border-top:1px solid rgba(255,255,255,.12);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:0 12px;font-size:16px}
  .thbtn{width:38px;height:38px}
  .sync span{display:none}
  .lockbtn span{display:none}
  .lockbtn{width:38px;padding:0;justify-content:center}
  .wrap{padding:18px 14px 60px}
  .page-h h1{font-size:28px}
  .att{grid-template-columns:minmax(0,1fr)}
  .att li:nth-child(n+4){display:none}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl colgroup{display:none}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id est" "mot mot" "loc etq" "med med";gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0;display:block}
  .c-id{grid-area:id}.c-est{grid-area:est;justify-self:end}.c-mot{grid-area:mot;width:auto}.c-loc{grid-area:loc;max-width:none}.c-etq{grid-area:etq;justify-self:end;align-self:start}.c-pot{display:none!important}.c-med{grid-area:med}
  .filt select{flex:1 1 140px}
  .fh{grid-template-columns:minmax(0,1fr);padding:18px}
  .fh h1{font-size:28px}
  .fh-qr{display:none}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .kv dd{margin-top:-6px}
  .plate-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hl li{grid-template-columns:minmax(0,1fr) auto}
  .hl-d{grid-column:1/-1}
  .fg,.md:not(.wide) .fg{grid-template-columns:minmax(0,1fr)}
  .ov{padding:12px 8px}
  .ftool-r .btn span{display:none}
  .ftool .bk span{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important}
  .md,.t,.btn,.ib,.lockbtn{transition-property:opacity,background-color,color,border-color!important}
  .ov .md,.ov.in .md{transform:none}
  .t{transform:none}
}

/* ===== Impresión ===== */
@media print{
  body{background:#fff;font-size:11.5px}
  .top,.no-print,.toasts,.ov,.ftool{display:none!important}
  body.print-labels .wrap{display:none!important}
  body.print-labels #print-area{display:block}
  #print-area .sheet{display:flex;flex-wrap:wrap;gap:4mm;align-content:flex-start}
  #print-area .sheet .lbl{outline:.2mm dashed #9AA3AF}
  #print-area .roll{overflow:hidden;page-break-after:always;break-after:page}
  #print-area .roll:last-child{page-break-after:auto;break-after:auto}
  .wrap{padding:0;max-width:none}
  .fh{border:0;border-bottom:2px solid var(--navy);border-radius:0;padding:0 0 12px;grid-template-columns:minmax(0,1fr) auto}
  .fh-qr{display:flex!important}
  .fh-qr .row,.fh-qr .adm{display:none!important}
  .fgrid{display:block!important;columns:2;column-gap:10px;margin-top:12px}
  .fcol{display:contents!important}
  .sec{break-inside:avoid;page-break-inside:avoid;border-color:#C9CED6;margin-bottom:10px;display:block}
  .scrollx{overflow:visible}
  .mtab .adm{display:none!important}
  .mtab{font-size:10.5px}.mtab td,.mtab th{padding:5px 4px}
  .sec-b{padding:10px 12px}.sec-h{padding:8px 12px}
  .plate-g{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pc b{font-size:14px}
  .sec .ib,.sec-h .btn{display:none!important}
  .plate.anim .pc{animation:none}
  .chip,.b-ok,.b-warn,.b-bad,.b-res,.cyc-bar i,.plate,.tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function setSync(st){

  const t = {
    local:['Modo local','Sin Apps Script: los datos se guardan solo en este navegador'],

    error:['Sin guardar, reintentar','Los cambios están en este equipo pero no llegaron a Google Sheets. Toca para reintentar.'],
    'error-load':['Sin conexión, reintentar','No se pudo leer Google Sheets. Toca para reintentar.']

async function loadRemote(){
  if (!API()) return;
  setSync('loading');
  try {
    const u = API() + (API().includes('?') ? '&' : '?') + 't=' + Date.now();
    const r = await fetch(u, {cache:'no-store'});
    const j = await r.json();
    if (!j || j.ok === false) throw new Error((j && j.error) || 'Respuesta inválida');
    loaded = true; loadErr = false;
    if (pending) { persist(); toast('Se enviaron a Google Sheets los cambios que estaban pendientes en este equipo.'); }

  }
}
let saving = null, again = false;
function persist(){
  cacheSave();
  if (!API()) { setSync('local'); return; }
  pending = true; cacheSave();
  if (saving) { again = true; return; }
  setSync('saving');
  saving = (async () => {
    try {
      const r = await fetch(API(), {method:'POST', body: JSON.stringify({pin: CONFIG.PIN, action:'saveAll', tables: toTables()})});
      const j = await r.json();
      if (!j || !j.ok) throw new Error((j && j.error) || 'Error al guardar');
      pending = false; cacheSave(); syncAt = new Date(); setSync('ok');

      console.warn('Error al guardar', e);

}

function qrMatrix(text){ const q = qrcode(0, 'Q'); q.addData(text); q.make(); const n = q.getModuleCount(); return {n, dark:(r,c) => q.isDark(r,c)}; }

    const s = c; while (c + 1 < n && dark(r, c+1)) c++;
    d += `M${s+mg} ${r+mg}h${c-s+1}v1h-${c-s+1}z`;
  }
  const out = `<svg viewBox="0 0 ${w} ${w}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${w}" height="${w}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

}
function qrBase(){

  const {n, dark} = qrMatrix(url), sc = 16, mg = 4, W = (n + mg*2) * sc, H = W + 110;

}

let TR = 'vib';
const TRENDS = {
  vib: {l:'Vibración máxima', u:'mm/s', val: md => vibMax(md), th: m => { const z = vibLimits(m).z; return [{v:z[1], st:'warn', l:'Zona C'}, {v:z[2], st:'bad', l:'Zona D'}]; }, ev: (v, m) => EV.vib(v, m)},
  temp: {l:'Temperatura de carcasa', u:'°C', val: md => num(md.temp), th: m => { const L = num(m.tempMax) || 80; return [{v:L * .9, st:'warn', l:'90 % del límite'}, {v:L, st:'bad', l:'Límite'}]; }, ev: (v, m) => EV.temp(v, m)},
  rod: {l:'Temperatura de rodamientos', u:'°C', val: md => { const x = [num(md.tDE), num(md.tNDE)].filter(v => v != null); return x.length ? Math.max(...x) : null; }, th: () => [{v:80, st:'warn', l:'80 °C'}, {v:90, st:'bad', l:'90 °C'}], ev: v => EV.rod(v)},
  corr: {l:'Corriente promedio', u:'A', val: md => { const x = ['i1','i2','i3'].map(k => num(md[k])).filter(v => v != null); return x.length ? x.reduce((s,v) => s + v, 0) / x.length : null; }, th: m => { const In = num(m.corriente); if (!In) return []; return [{v:In, st:'warn', l:'Nominal'}, {v:In * (num(m.fs) || 1), st:'bad', l:'Factor de servicio'}].filter((t,i,a) => i === 0 || t.v !== a[0].v); }, ev: (v, m) => EV.corr(v, m)},
  meg: {l:'Aislamiento a 1 min', u:'MΩ', log:true, val: md => num(md.megger), th: () => [{v:100, st:'warn', l:'100 MΩ'}, {v:5, st:'bad', l:'Mínimo 5 MΩ'}], ev: v => EV.meg(v)}
};
function trendHtml(m){
  const meds = [...(IDX.meds[m.id] || [])].reverse();
  const T = TRENDS[TR];
  const pts = meds.map(md => ({d: parseD(md.fecha), v: T.val(md), md})).filter(p => p.d && p.v != null);
  const tabs = `<div class="seg seg-sm no-print" role="group" aria-label="Variable">${Object.entries(TRENDS).map(([k,t]) => `<button type="button" data-a="trend" data-v="${k}" aria-pressed="${TR === k}">${t.l.replace('Temperatura de ','Temp. ').replace(' promedio','').replace(' a 1 min','')}</button>`).join('')}</div>`;
  if (pts.length < 2) return `${tabs}<p class="muted" style="margin:14px 0 0">${pts.length ? 'Hay una sola medición de esta variable.' : 'No hay mediciones de esta variable.'} La tendencia aparece desde la segunda medición.</p>`;
  const W = 640, H = 210, L = 46, R = 92, Tp = 14, B = 30;
  const th = T.th(m);
  const f = T.log ? (v => Math.log10(Math.max(v, 0.1))) : (v => v);
  const vals = [...pts.map(p => p.v), ...th.map(t => t.v)].map(f);
  let lo = T.log ? Math.min(...vals) : 0, hi = Math.max(...vals);
  if (T.log) { lo = Math.floor(lo); hi = Math.ceil(hi + .05); } else hi = hi * 1.12 || 1;
  const x0 = pts[0].d.getTime(), x1 = pts[pts.length - 1].d.getTime();
  const X = t => L + (x1 === x0 ? (W - L - R) / 2 : (t - x0) / (x1 - x0) * (W - L - R));
  const Y = v => Tp + (1 - (f(v) - lo) / (hi - lo || 1)) * (H - Tp - B);
  const ticks = T.log ? Array.from({length: hi - lo + 1}, (_, i) => Math.pow(10, lo + i)) : [0, hi / 2, hi].map(v => v);
  const col = st => st === 'bad' ? '#C8102E' : st === 'warn' ? '#D99A2B' : st === 'ok' ? '#2E9A65' : '#8D9AB2';
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d.getTime()).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const mid = pts.length > 2 ? pts[Math.floor(pts.length / 2)] : null;
  return `${tabs}
  <svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${esc(T.l)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" class="tg"/><text x="${L - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" class="tl">${fmtN(t, t < 10 ? 1 : 0)}</text>`).join('')}
    ${th.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t.v).toFixed(1)}" y2="${Y(t.v).toFixed(1)}" stroke="${col(t.st)}" stroke-dasharray="5 4" stroke-width="1.4"/><text x="${W - R + 6}" y="${(Y(t.v) + 4).toFixed(1)}" class="tl" fill="${col(t.st)}">${esc(t.l)}</text>`).join('')}
    <path d="${line}" fill="none" stroke="#6e0014" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p => { const r = T.ev(p.v, m); return `<circle cx="${X(p.d.getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="${col(r.st)}" stroke="#fff" stroke-width="1.5"><title>${esc(fmtD(p.md.fecha))}: ${esc(fmtN(p.v))} ${esc(T.u)}, ${esc(r.note)}</title></circle>`; }).join('')}
    <text x="${L}" y="${H - 8}" class="tl">${esc(fmtD(pts[0].md.fecha))}</text>
    ${mid ? `<text x="${X(mid.d.getTime()).toFixed(1)}" y="${H - 8}" class="tl" text-anchor="middle">${esc(fmtD(mid.md.fecha))}</text>` : ''}
    <text x="${W - R}" y="${H - 8}" class="tl" text-anchor="end">${esc(fmtD(pts[pts.length - 1].md.fecha))}</text>
  </svg>
  <p class="sm" style="margin:6px 0 0">${esc(T.l)} en ${esc(T.u)}${T.log ? ' (escala logarítmica)' : ''}, ${pl(pts.length,'medición','mediciones')}. Pasa el cursor sobre un punto para ver el detalle.</p>`;
}

/* ---- Tooltip ---- */
const TIP = document.createElement('div'); TIP.className = 'tip'; TIP.setAttribute('role','tooltip'); document.body.appendChild(TIP);
let tipEl = null, tipT = 0;
function showTip(el){
  const t = el.getAttribute('data-tip'); if (!t) return;
  tipEl = el; TIP.textContent = t; TIP.classList.add('on');
  const r = el.getBoundingClientRect(), w = TIP.offsetWidth, h = TIP.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(innerWidth - w - 8, x));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  TIP.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function hideTip(){ tipEl = null; TIP.classList.remove('on'); }
document.addEventListener('pointerover', ev => { if (ev.pointerType === 'touch') return; const el = ev.target.closest('[data-tip]'); if (el && el !== tipEl) { clearTimeout(tipT); tipT = setTimeout(() => showTip(el), TIP.classList.contains('on') ? 0 : 180); } else if (!el && tipEl) { clearTimeout(tipT); hideTip(); } });
document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => hideTip());
document.addEventListener('pointerdown', ev => { if (ev.pointerType !== 'touch') return; const el = ev.target.closest('[data-tip]'); if (el && !el.dataset.a) { showTip(el); clearTimeout(tipT); tipT = setTimeout(hideTip, 2800); } else hideTip(); });
addEventListener('scroll', () => tipEl && hideTip(), {passive:true});

      <div class="lbl-qr">${url ? qrSvg(url) : '<div class="lbl-noqr">Falta la dirección pública</div>'}</div>
      <div class="lx">
        <div class="lx1">${esc(m.id)} · ${esc(m.nombre)}</div>

        <div class="lx4">${esc(l4)}</div>

let modalEl = null;
function openModal({title, body, foot = '', wide = false, onSubmit, onMount}){
  closeModal(true);
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<form class="md ${wide ? 'wide' : ''}" novalidate role="dialog" aria-modal="true" aria-labelledby="md-t"><div class="md-h"><h2 id="md-t">${esc(title)}</h2><button type="button" class="ib" data-a="modal-close" aria-label="Cerrar">${ic('x')}</button></div><div class="md-b">${body}</div>${foot ? `<div class="md-f">${foot}</div>` : ''}</form>`;
  document.body.appendChild(ov); modalEl = ov;
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('in')));
  const form = ov.querySelector('form');
  form.addEventListener('submit', ev => { ev.preventDefault(); onSubmit && onSubmit(form); });
  ov.addEventListener('mousedown', ev => { if (ev.target === ov && !form.dataset.dirty) closeModal(); });
  form.addEventListener('input', () => form.dataset.dirty = '1');
  onMount && onMount(form);
  const first = form.querySelector('input:not([readonly]):not([type=hidden]):not([type=checkbox]),select,textarea');
  if (first && matchMedia('(pointer:fine)').matches) setTimeout(() => first.focus({preventScroll:true}), 80);
  document.body.style.overflow = 'hidden';
  return form;
}
function closeModal(instant){
  if (!modalEl) return;
  const ov = modalEl; modalEl = null; document.body.style.overflow = '';
  if (instant) { ov.remove(); return; }
  ov.classList.remove('in'); ov.classList.add('out'); setTimeout(() => ov.remove(), 150);
}

  $('#toasts').appendChild(t);

const TAG_SERIE = {TUBOACERO:1, TECHOACERO:2, MAYACERO:3};
function plantOf(name){ const k = normKey(name); return PLANTAS.find(p => normKey(p.id) === k || normKey(p.nombre) === k) || null; }
function nextTag(plantaName){
  const P = plantOf(plantaName); const ser = P ? TAG_SERIE[P.id] : null; if (!ser) return '';
  let mx = ser * 1000;
  [...state.motores, ...BASE_MOTORES].forEach(m => { const x = /^EM-(\d{4})$/.exec(m.id); if (x) { const n = +x[1]; if (n > mx && n < (ser + 1) * 1000) mx = n; } });

}
function presetFor(pid, lid, cod){
  const P = PLANTAS.find(p => p.id === pid); if (!P) return {};
  const o = {planta:P.nombre, pais:'Guatemala', estado:'Operando'};
  const L = lid ? P.lineas.find(l => l.id === lid) : null;
  if (L) {
    const LI = (layIndex()[P.id] || {lineas:{}}).lineas[L.id];
    const ex = LI && LI.motores.find(m => m.linea);
    o.linea = ex ? ex.linea : (L.al && L.al[0]) || L.nombre; o.ut = L.tag || '';

async function importFile(file){
  if (!window.XLSX) { toast('No se pudo cargar el lector de Excel. Revisa tu conexión a internet.', 'bad'); return; }

  };

    unitClean(raw); const c = cleanMotor(raw);

    const utU = c.ut.toUpperCase();

    const i = result.findIndex(x => x.id === c.id);

function baseMissing(){ const ids = new Set(state.motores.map(m => m.id)); return BASE_MOTORES.filter(m => !ids.has(String(m.id).toUpperCase())); }
function baseNote(emptyOk){
  if (demo || (!state.motores.length && !emptyOk)) return '';
  const miss = baseMissing(); if (!miss.length) return '';
  const pls = uniq(miss.map(m => m.planta)).join(' y ');
  return `<div class="note no-print"><p><b>Hay ${pl(miss.length,'motor nuevo','motores nuevos')} en la lista base (${esc(pls)}) que todavía no están registrados.</b> Agrégalos para que aparezcan en el inventario, la taxonomía y las etiquetas${API() ? ' y se guarden en Google Sheets' : ''}.</p><button class="btn btn-pri" data-a="load-base">${ic('upload')} Agregar ${pl(miss.length,'motor','motores')}</button></div>`;
}
/* TAG anterior a TAG nuevo (nov. 2026): Tuboacero EM-001…136 → EM-1001…1136; Mayacero EM-201…294 → EM-3001…3094 */
function newId(id){
  const x = /^EM-(\d{3})$/.exec(String(id || '').trim().toUpperCase()); if (!x) return null;
  const n = +x[1];
  return n >= 1 && n <= 136 ? 'EM-' + (1000 + n) : n >= 201 && n <= 294 ? 'EM-' + (3000 + n - 200) : null;
}
function migrateIds(){
  const ids = new Set(state.motores.map(m => m.id)), map = {};
  state.motores.forEach(m => { const nw = newId(m.id); if (nw && !ids.has(nw)) { map[m.id] = nw; m.id = nw; } });
  const n = Object.keys(map).length;
  if (n) { state.historial.forEach(h => { if (map[h.motorId]) h.motorId = map[h.motorId]; }); state.mediciones.forEach(h => { if (map[h.motorId]) h.motorId = map[h.motorId]; }); }
  return n;
}
function sampleData(){ return {motores: BASE_MOTORES.map(cleanMotor), historial: [], mediciones: []}; }

/* ============ Inicio ============ */
(function boot(){
  if (SOLO) {
    document.body.classList.add('solo');
    const br = $('.brand'); br.dataset.a = 'lay'; br.setAttribute('aria-label', 'Ir a la taxonomía');
    $('.brand-t strong').textContent = 'Taxonomía de motores'; $('.brand-t span').textContent = 'Confiabilidad, Multiperfiles';
  }
  applyAdmin();
  setTheme(store.get(LS_THEME) === 'dark', true);
  readRoute();
  const had = cacheLoad();
  if (had && migrateIds()) cacheSave();
  if ((!had || demo) && !API()) { state = sampleData(); demo = false; cacheSave(); }
  else if (had && !API() && store.get('motores-multi-basev') !== '2') { state.motores.push(...baseMissing().map(cleanMotor)); cacheSave(); }
  store.set('motores-multi-basev', '2');
  if (!API()) setSync('local');
  render();
  if (API()) loadRemote();
})();
